
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猫逆トロフィー｜管理者ページ</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:24px;
  background:#10131f;color:#e5c16c;
  font-family:sans-serif
}
main{max-width:680px;margin:30px auto}
h1{font-size:28px}
h2{margin-top:32px}
input,textarea,select,button{
  width:100%;padding:13px;margin:7px 0;
  border-radius:8px;font-size:16px;
  font-family:inherit
}
input,textarea,select{
  background:#222839;color:white;
  border:1px solid #555
}
button{
  background:#e5c16c;color:#10131f;
  border:0;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
button.secondary{background:#59647c;color:white}
button.danger{background:#a43e48;color:white}
label{display:block;margin-top:12px}
label.check{
  display:flex;align-items:center;gap:10px
}
label.check input{width:auto}
.item{
  background:#1c2232;border:1px solid #454b60;
  padding:16px;margin:14px 0;border-radius:12px
}
.item h3{margin:0 0 8px}
.item p{color:#ddd;white-space:pre-wrap}
.actions{display:flex;gap:8px}
.actions button{flex:1}
#message{color:#eee;white-space:pre-wrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>🏆 管理者ページ</h1>
<p>猫逆トロフィー｜実績管理</p>

<section id="login">
  <h2>管理者ログイン</h2>
  <input id="email" type="email" placeholder="メールアドレス">
  <input id="password" type="password" placeholder="パスワード">
  <button id="loginButton">ログイン</button>
</section>

<section id="admin" hidden>
<section id="roomHostAdmin">
  <h2>🏠 部屋主権限管理</h2>
  <label for="hostSearch">プレイヤー名</label>
  <input id="hostSearch" type="search" maxlength="20" placeholder="プレイヤー名で検索">
  <button id="hostSearchBtn" type="button">検索</button>
  <button id="hostListBtn" type="button" class="secondary">部屋主一覧</button>
  <p id="hostStatus" role="status" style="color:#eee;white-space:pre-wrap"></p>
  <div id="hostResults"></div>
</section>

 
<section id="trophyPreviewAdmin">
  <h2>🏆 獲得演出プレビュー</h2>
  <p>トロフィーの獲得演出を確認できます。</p>
  
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">
  <button type="button" onclick="previewTrophy('銅')">🥉 銅</button>
  <button type="button" onclick="previewTrophy('銀')">🥈 銀</button>
  <button type="button" onclick="previewTrophy('金')">🥇 金</button>
  <button type="button" onclick="previewTrophy('伝説')">🌈 伝説</button>
</div>

</section>
 <h2>実績を登録・編集</h2>

  <form id="achievementForm">
    <input id="editId" type="hidden">

    <label for="name">実績名</label>
    <input id="name" required maxlength="150">

    <label for="description">実績の説明</label>
    <textarea id="description" required rows="3"></textarea>

    <label for="category">カテゴリー</label>
    <input id="category" required placeholder="例：魔女">

    <label for="rarity">レアリティ</label>
    <select id="rarity">
      <option value="銅">銅</option>
      <option value="銀">銀</option>
      <option value="金">金</option>
      <option value="プラチナ">プラチナ</option>
    </select>

    <label for="role">対応役職（任意）</label>
    <input id="role" placeholder="例：魔女">

    <label class="check">
      <input id="published" type="checkbox">
      公開する
    </label>

    <button id="saveButton" type="submit">
      実績を保存
    </button>
    <button id="cancelButton" class="secondary"
      type="button" hidden>
      編集をキャンセル
    </button>
  </form>

<section id="autoRuleAdmin">
<h2>戦績連動型トロフィー</h2>
<p>実績を保存してから選択してください。無効化すると新規自動付与を停止します。</p>
<form id="autoRuleForm">
<label for="autoAchievement">対象トロフィー</label><select id="autoAchievement" required></select>
<label for="autoMetric">獲得条件</label><select id="autoMetric"><option value="total_matches">通算対戦数（廃村除外）</option><option value="total_wins">通算勝利数</option><option value="win_streak">最高連勝数</option><option value="role_matches">役職別対戦数</option><option value="role_wins">役職別勝利数</option><option value="faction_matches">陣営別対戦数</option><option value="faction_wins">陣営別勝利数</option><option value="room_matches">部屋別対戦数</option><option value="room_wins">部屋別勝利数</option></select>
<div id="autoTargetWrap" hidden><label id="autoTargetLabel" for="autoTarget">対象</label><input id="autoTarget" type="text" disabled autocomplete="off"><select id="autoFaction" hidden disabled><option value="市民陣営">市民陣営</option><option value="人狼陣営">人狼陣営</option><option value="その他">その他</option></select><p style="font-size:13px;color:#b5bdcb">戦績に登録した名称と一致させてください。</p></div>
<label for="autoThreshold">達成必要数</label><input id="autoThreshold" type="number" min="1" max="2147483647" step="1" value="1" required>
<label class="check"><input id="autoEnabled" type="checkbox">自動獲得を有効にする</label>
<p id="autoConditionPreview" style="color:#ddd;overflow-wrap:anywhere" aria-live="polite"></p>
<button id="autoSave" type="submit" disabled>獲得条件を保存</button>
</form>
<button id="autoSync" type="button" class="secondary" disabled>全ユーザーの自動獲得条件を一括再判定</button>
<p id="autoStatus" role="status" style="white-space:pre-wrap;overflow-wrap:anywhere"></p>
</section>
<details id="orderEditor" style="margin-top:28px">
<summary style="cursor:pointer;font-size:20px;font-weight:bold">トロフィー表示順設定</summary>
<p>上から順に標準表示されます。非公開の実績も含みます。順位の数字を変更して「移動」を押すか、上下ボタンで移動し、最後に保存してください。</p>
<div id="orderRows"></div>
<button id="orderSave" type="button" disabled>表示順を一括保存</button>
<button id="orderReset" type="button" class="secondary" disabled>変更を取り消す</button>
<p id="orderStatus" role="status" style="color:#eee;overflow-wrap:anywhere"></p>
</details>
<style>
.order-row{display:grid;grid-template-columns:56px minmax(0,1fr) 48px 42px 42px;gap:5px;align-items:center;padding:7px 0;border-bottom:1px solid #454b60}
.order-row input,.order-row button{padding:8px 2px;margin:0;min-width:0;width:100%;font-size:14px;text-align:center}
.order-row span{overflow-wrap:anywhere;color:#eee;font-size:14px}.order-row small{display:block;color:#aeb7c9}
@media(max-width:390px){.order-row{grid-template-columns:46px minmax(0,1fr) 38px 34px 34px;gap:3px}}
</style>
  <h2>登録済みの実績</h2>
  <div id="achievementList"></div>

  <button id="logoutButton" class="secondary">
    ログアウト
  </button>
</section>

<p id="message" role="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const db = supabase.createClient(
  "https://qwmraeabwlnkwsaqwqqg.supabase.co",
  "sb_publishable_FQnGEfpt440nFZzYcLYosQ_F7WEPE6f"
);

const $ = id => document.getElementById(id);
let records = [];

function showMessage(text){
  $("message").textContent = text;
}

function resetForm(){
  $("achievementForm").reset();
  $("editId").value = "";
  $("cancelButton").hidden = true;
  $("saveButton").textContent = "実績を保存";
}

async function checkAdmin(){
  const {data:{user},error} = await db.auth.getUser();

  if(error || !user){
    $("login").hidden = false;
    $("admin").hidden = true;
    return;
  }

  const {data,error:adminError} = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if(adminError || !data){
    $("login").hidden = true;
    $("admin").hidden = true;
    showMessage("このアカウントには管理者権限がありません。");
    return;
  }

  $("login").hidden = true;
  $("admin").hidden = false;
  showMessage("");
  await loadAchievements();
  await loadRoomHosts(true);
}

async function loadAchievements(){
  const {data,error} = await db
    .from("achievements")
    .select("*")
    .order("sort_order",{ascending:true,nullsFirst:false})
    .order("id",{ascending:true});

  if(error){
    showMessage("取得失敗：" + error.message);
    return;
  }

  records = data || [];
  renderOrderEditor(true);
  await loadAutoRules();
  const list = $("achievementList");
  list.replaceChildren();

  if(!records.length){
    list.textContent = "実績はまだありません。";
    return;
  }

  for(const item of records){
    const card = document.createElement("div");
    card.className = "item";

    const title = document.createElement("h3");
    title.textContent = item.name;

    const detail = document.createElement("p");
    detail.textContent =
      `${item.description}\n` +
      `カテゴリー：${item.category}\n` +
      `レアリティ：${item.rarity}\n` +
      `役職：${item.role || "なし"}\n` +
      `公開状態：${item.is_published ? "公開" : "非公開"}`;

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.textContent = "編集";
    edit.type = "button";
    edit.onclick = () => editAchievement(item.id);

    const del = document.createElement("button");
    del.textContent = "削除";
    del.type = "button";
    del.className = "danger";
    del.onclick = () => deleteAchievement(item.id);

    actions.append(edit,del);
    card.append(title,detail,actions);
    list.append(card);
  }
}

function editAchievement(id){
  const item = records.find(x => x.id === id);
  if(!item) return;

  $("editId").value = item.id;
  $("name").value = item.name;
  $("description").value = item.description;
  $("category").value = item.category;
  $("rarity").value = item.rarity;
  $("role").value = item.role || "";
  $("published").checked = item.is_published;

  $("saveButton").textContent = "変更を保存";
  $("cancelButton").hidden = false;
  $("achievementForm").scrollIntoView({behavior:"smooth"});
}

async function deleteAchievement(id){
  const item = records.find(x => x.id === id);
  if(!item) return;

  if(!confirm(`「${item.name}」を削除しますか？`))
    return;

  const {data,error} = await db
    .from("achievements")
    .delete()
    .eq("id",id)
    .select("id");

  if(error){
    showMessage("削除失敗：" + error.message);
    return;
  }
  if(!data || !data.length){
    showMessage("削除できませんでした。権限を確認してください。");
    return;
  }

  resetForm();
  showMessage("実績を削除しました。");
  await loadAchievements();
}

$("achievementForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const id = $("editId").value;
  const payload = {
    name:$("name").value.trim(),
    description:$("description").value.trim(),
    category:$("category").value.trim(),
    rarity:$("rarity").value,
    role:$("role").value.trim() || null,
    is_published:$("published").checked
  };

  if(!payload.name || !payload.description ||
     !payload.category){
    showMessage("必須項目を入力してください。");
    return;
  }

  $("saveButton").disabled = true;

  let result;
  if(id){
    result = await db.from("achievements")
      .update(payload)
      .eq("id",Number(id))
      .select("id");
  }else{
    result = await db.from("achievements")
      .insert(payload)
      .select("id");
  }

  $("saveButton").disabled = false;

  if(result.error){
    showMessage("保存失敗：" + result.error.message);
    return;
  }
  if(!result.data || !result.data.length){
    showMessage("保存できませんでした。権限を確認してください。");
    return;
  }

  resetForm();
  showMessage("実績を保存しました！");
  await loadAchievements();
});

$("cancelButton").onclick = resetForm;

$("loginButton").onclick = async()=>{
  showMessage("ログイン中...");

  const {error} = await db.auth.signInWithPassword({
    email:$("email").value,
    password:$("password").value
  });

  if(error){
    showMessage("ログイン失敗：" + error.message);
    return;
  }

  $("password").value = "";
  await checkAdmin();
};

$("logoutButton").onclick = async()=>{
  const {error} = await db.auth.signOut();
  if(error){
    showMessage("ログアウト失敗：" + error.message);
    return;
  }
  resetForm();
  showMessage("");
  await checkAdmin();
};


let hostBusy = false;
let hostOnly = true;
async function loadRoomHosts(only = hostOnly) {
  if (hostBusy) return;
  hostBusy = true;
  hostOnly = only;
  $("hostSearchBtn").disabled = $("hostListBtn").disabled = true;
  $("hostResults").replaceChildren();
  $("hostStatus").textContent = "読み込み中...";
  try {
    const {data,error} = await db.rpc("admin_find_room_hosts", {
      p_query: only ? "" : $("hostSearch").value.trim(), p_hosts_only: only
    });
    if(error) throw error;
    if($("admin").hidden) return;
    $("hostStatus").textContent = data.length ? `${data.length}件（最大100件）` : "該当するプレイヤーはいません。";
    for(const player of data){
      const card = document.createElement("div"); card.className = "item";
      const name = document.createElement("h3"); name.textContent = player.username || "名前未設定";
      const detail = document.createElement("p"); detail.textContent = (player.is_host ? "部屋主権限あり" : "部屋主権限なし") + "\nID: " + player.user_id;
      detail.style.overflowWrap = "anywhere";
      const btn = document.createElement("button"); btn.type = "button";
      btn.textContent = player.is_host ? "権限を剥奪" : "部屋主権限を付与";
      btn.className = player.is_host ? "danger" : "";
      btn.onclick = async () => {
        if(hostBusy || !confirm(`${player.username || player.user_id} の部屋主権限を${player.is_host ? "剥奪" : "付与"}しますか？`)) return;
        hostBusy = true; btn.disabled = true;
        try {
          const {data:{user},error:authError} = await db.auth.getUser();
          if(authError || !user) throw new Error("ログインしてください");
          const result = player.is_host
            ? await db.from("room_hosts").delete().eq("user_id",player.user_id).select("user_id").single()
            : await db.from("room_hosts").insert({user_id:player.user_id,granted_by:user.id}).select("user_id").single();
          if(result.error) throw result.error;
          hostBusy = false;
          await loadRoomHosts();
        } catch(e) { $("hostStatus").textContent = "変更失敗：" + e.message; }
        finally { hostBusy = false; btn.disabled = false; }
      };
      card.append(name,detail,btn); $("hostResults").append(card);
    }
  } catch(e) { $("hostStatus").textContent = "取得失敗：" + e.message; }
  finally { hostBusy = false; $("hostSearchBtn").disabled = $("hostListBtn").disabled = false; }
}
$("hostSearchBtn").onclick = () => loadRoomHosts(false);
$("hostListBtn").onclick = () => loadRoomHosts(true);
$("hostSearch").addEventListener("keydown", e => { if(e.key === "Enter") loadRoomHosts(false); });

let autoRules = new Map();
let autoBusy = false;
function autoTargetKind(){
  const metric = $("autoMetric").value;
  return /^(role|faction|room)_/.test(metric) ? metric.split("_")[0] : "";
}
function readAutoTarget(){
  const kind=autoTargetKind();
  return kind === "faction" ? $("autoFaction").value : kind ? $("autoTarget").value.trim() : null;
}
function refreshAutoCondition(){
  const kind=autoTargetKind(), isFaction=kind === "faction";
  $("autoTargetWrap").hidden=!kind;
  $("autoTarget").hidden=!kind || isFaction;
  $("autoTarget").disabled=!kind || isFaction;
  $("autoTarget").required=!!kind && !isFaction;
  $("autoFaction").hidden=!isFaction;
  $("autoFaction").disabled=!isFaction;
  $("autoFaction").required=isFaction;
  $("autoTargetLabel").textContent=({role:"対象役職",faction:"対象陣営",room:"対象部屋"})[kind] || "対象";
  $("autoTargetLabel").htmlFor=isFaction ? "autoFaction" : "autoTarget";
  $("autoTarget").placeholder=kind === "role" ? "例：独裁者" : "例：猫逆";
  const metric=$("autoMetric").value, n=$("autoThreshold").value || "—", target=readAutoTarget() || "（対象未入力）";
  $("autoConditionPreview").textContent="獲得条件："+(metric === "win_streak" ? n+"連勝" : (kind ? target+"で" : "通算")+n+(metric.endsWith("wins") ? "勝" : "戦"));
}
function showAutoRule(){
  const r = autoRules.get($("autoAchievement").value);
  $("autoMetric").value = r?.metric || "total_matches";
  $("autoThreshold").value = r?.threshold || 1;
  $("autoEnabled").checked = r?.is_enabled || false;
  $("autoTarget").value = r?.target || "";
  const faction = $("autoFaction");
  for(const opt of [...faction.options]) if(opt.dataset.custom) opt.remove();
  if(autoTargetKind()==="faction" && r?.target && ![...faction.options].some(o=>o.value===r.target)){
    const opt=document.createElement("option"); opt.value=r.target; opt.textContent=r.target; opt.dataset.custom="1"; faction.append(opt);
  }
  faction.value=autoTargetKind()==="faction" && r?.target ? r.target : "市民陣営";
  refreshAutoCondition();
}
async function loadAutoRules(){
  const sel = $("autoAchievement"), prev = sel.value;
  $("autoSave").disabled = $("autoSync").disabled = true;
  try {
    const {data,error} = await db.rpc("admin_get_auto_rules");
    if(error) throw error;
    autoRules = new Map((data || []).map(r=>[String(r.achievement_id),r]));
    sel.replaceChildren();
    for(const a of records){
      const opt = document.createElement("option"); opt.value=String(a.id);
      opt.textContent = a.name + (autoRules.get(opt.value)?.is_enabled ? " ［自動］" : "") + (!a.is_published ? " ［非公開］" : ""); sel.append(opt);
    }
    if(records.some(a=>String(a.id)===prev)) sel.value=prev;
    showAutoRule();
    $("autoSave").disabled = autoBusy || !sel.value; $("autoSync").disabled=autoBusy;
  } catch(e){ $("autoStatus").textContent="条件取得失敗："+e.message; }
}
$("autoAchievement").onchange=showAutoRule;
$("autoMetric").onchange=()=>{$("autoTarget").value=""; refreshAutoCondition();};
$("autoTarget").oninput=refreshAutoCondition;
$("autoFaction").onchange=refreshAutoCondition;
$("autoThreshold").oninput=refreshAutoCondition;
refreshAutoCondition();
$("autoRuleForm").onsubmit=async e=>{
  e.preventDefault(); if(autoBusy || !$("autoAchievement").value) return;
  const threshold=Number($("autoThreshold").value);
  if(!Number.isInteger(threshold)||threshold<1||threshold>2147483647) return;
  const target=readAutoTarget();
  if(autoTargetKind() && !target){$("autoStatus").textContent="対象を指定してください。";return;}
  autoBusy=true; $("autoSave").disabled=$("autoSync").disabled=true;
  try {
    const {error}=await db.rpc("admin_set_auto_rule",{p_achievement_id:Number($("autoAchievement").value),p_metric:$("autoMetric").value,p_threshold:threshold,p_enabled:$("autoEnabled").checked,p_target:target});
    if(error) throw error;
    $("autoStatus").textContent="保存しました。既存戦績への適用は一括再判定を押してください。";
  }catch(e){$("autoStatus").textContent="保存失敗："+e.message;}
  finally{autoBusy=false;await loadAutoRules();}
};
$("autoSync").onclick=async()=>{
  if(autoBusy || !confirm("全ユーザーを再判定します。条件未達成の自動獲得分は取り消されます。実行しますか？")) return;
  autoBusy=true; $("autoSave").disabled=$("autoSync").disabled=true;
  $("autoStatus").textContent="再判定中…";
  try{const {data,error}=await db.rpc("admin_sync_all_auto_achievements");if(error)throw error;$("autoStatus").textContent=`再判定完了：${data}人`;}
  catch(e){$("autoStatus").textContent="再判定失敗："+e.message;}
  finally{autoBusy=false;await loadAutoRules();}
};


let orderDraft=[], orderBusy=false;
function orderDirty(){return orderDraft.length===records.length && orderDraft.some((a,n)=>String(a.id)!==String(records[n].id));}
function renderOrderEditor(reset=false){
  if(reset) orderDraft=records.slice();
  const rows=$("orderRows"); rows.replaceChildren();
  orderDraft.forEach((a,n)=>{
    const row=document.createElement("div"); row.className="order-row";
    const rank=document.createElement("input"); rank.type="number";rank.min="1";rank.max=String(orderDraft.length);rank.step="1";rank.value=String(n+1);rank.disabled=orderBusy;rank.setAttribute("aria-label",a.name+"の移動先順位");
    const name=document.createElement("span");name.textContent=a.name;const meta=document.createElement("small");meta.textContent=a.rarity+(a.is_published?"":"・非公開");name.append(meta);
    function move(to){if(orderBusy||!Number.isInteger(to)||to<0||to>=orderDraft.length){rank.value=String(n+1);return;}const [item]=orderDraft.splice(n,1);orderDraft.splice(to,0,item);renderOrderEditor();}
    function btn(label,action,disabled=false){const b=document.createElement("button");b.type="button";b.className="secondary";b.textContent=label;b.disabled=orderBusy||disabled;b.onclick=action;return b;}
    const go=btn("移動",()=>move(Number(rank.value)-1));rank.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();move(Number(rank.value)-1);}});
    const up=btn("↑",()=>move(n-1),n===0),down=btn("↓",()=>move(n+1),n===orderDraft.length-1);up.setAttribute("aria-label",a.name+"を上へ");down.setAttribute("aria-label",a.name+"を下へ");row.append(rank,name,go,up,down);rows.append(row);
  });
  $("orderSave").disabled=orderBusy||!orderDirty();$("orderReset").disabled=orderBusy||!orderDirty();
}
$("orderReset").onclick=()=>{renderOrderEditor(true);$("orderStatus").textContent="変更を取り消しました。";};
$("orderSave").onclick=async()=>{
  if(orderBusy||!orderDirty())return;
  orderBusy=true;renderOrderEditor();$("orderStatus").textContent="保存中…";
  try{const {error}=await db.rpc("admin_reorder_achievements",{p_ids:orderDraft.map(a=>a.id)});if(error)throw error;await loadAchievements();$("orderStatus").textContent="表示順を保存しました。";}
  catch(e){$("orderStatus").textContent="保存失敗："+e.message;}
  finally{orderBusy=false;renderOrderEditor();}
};

checkAdmin();
</script>

<div id="adminTrophyEffect" hidden

  <p id="adminTrophyName"></p>
</div>
<style>
  #adminTrophyEffect[hidden] {
    display: none !important;
  }
</style>

<script>
let adminTrophyTimer;

function previewTrophy(rarity) {
  const images = {
    "銅": "DD12C370-5B0B-48A9-B4B8-D82A58A75C5F.png",
    "銀": "FE5334A6-05ED-4D18-9268-C4A80665A74F.png",
    "金": "C302C0C0-2636-4FCE-A1BB-A3A7B398CD7D.png",
    "伝説": "7592707B-2DA2-4B5F-9131-D481572EE8F2.png"
  };

  const colors = {
    "銅": "#cd7f32",
    "銀": "#dce6f5",
    "金": "#ffd700",
    "伝説": "#b46aff"
  };

  const effect = document.getElementById("adminTrophyEffect");
  const img = document.getElementById("adminTrophyImage");
  const title = document.getElementById("adminTrophyTitle");

  clearTimeout(adminTrophyTimer);

  img.src = images[rarity];
  img.alt = rarity + "トロフィー";

  title.textContent = rarity === "伝説"
    ? "LEGENDARY ACHIEVEMENT"
    : "TROPHY UNLOCKED!";

  title.style.color = colors[rarity];
  img.style.setProperty("--glow", colors[rarity]);

  effect.hidden = false;

  img.style.animation = "none";
  void img.offsetWidth;
  img.style.animation =
    "adminTrophyPop .8s ease-out both, adminTrophyGlow 1.5s ease-in-out .8s infinite";

  adminTrophyTimer = setTimeout(() => {
    effect.hidden = true;
    img.style.animation = "none";
  }, 2500);
}
</script>

<style>
@keyframes adminTrophyPop {
  0% {
    transform: scale(.3) rotate(-12deg);
    opacity: 0;

  65% {
    transform: scale(1.2) rotate(4deg);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes adminTrophyGlow {
  0%, 100% {
    filter: drop-shadow(0 0 8px var(--glow));
  }
  50% {
    filter: drop-shadow(0 0 28px var(--glow));
  }
}
</style>
