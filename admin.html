
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>猫逆トロフィー｜管理者ページ</title>
  <style>
    body {
      background: #10131f;
      color: #e5c16c;
      font-family: sans-serif;
      padding: 24px;
    }
    main {
      max-width: 600px;
      margin: 50px auto;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #e5c16c;
      border: none;
      cursor: pointer;
    }
    input {
      background: #222839;
      color: white;
      border: 1px solid #555;
    }
  </style>
</head>
<body>
  <main>
    <h1>🏆 管理者ページ</h1>
    <p>猫逆トロフィー｜実績管理</p>

    <h2>管理者ログイン</h2>
    <input type="email" placeholder="メールアドレス">
    <input type="password" placeholder="パスワード">
    <button type="button">ログイン</button>

    <p>※現在は画面のみ。ログイン機能は次に設定します。</p>
  </main>
</body>
</html>
