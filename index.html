
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏆猫逆トロフィー🏆</title>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#101522;color:#e4bd68;font-family:system-ui,sans-serif}
header{text-align:center;padding:38px 16px 22px;background:linear-gradient(#20283b,#101522)}
h1{font-size:clamp(24px,6vw,36px);margin:0}
header p,.muted{color:#aeb7c9}
main{max-width:850px;margin:auto;padding:16px}
  
/* プロフィールのスマホ表示調整 */
#userAuth {
  width: calc(100% - 32px);
  max-width: 500px;
  box-sizing: border-box;
}

#userAuth input,
#userAuth textarea {
  max-width: 100%;
  box-sizing: border-box;
}

#avatarInput {
  display: block;
  width: 100%;
  min-width: 0;
}

#profileStats {
  min-width: 0;
  overflow-wrap: anywhere;
}

#profileAvatar {
  width: 96px;
  height: 96px;
  border: 3px solid #e4bd68;
}

.panel,.achievement{background:#1b2333;border:1px solid #3d465a;border-radius:14px;padding:18px;margin-bottom:14px}
.progress{height:12px;background:#343c4c;border-radius:20px;overflow:hidden;margin:12px 0}
#bar{height:100%;width:0;background:#d9ad53;transition:width .2s}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
input,select{background:#222c40;color:#fff;border:1px solid #58647a;border-radius:9px;padding:12px;font-size:16px;min-width:0;flex:1}
.achievement{display:flex;align-items:flex-start;gap:12px;color:#f1f2f6}
.achievement input{flex:none;width:23px;height:23px;accent-color:#d9ad53}
.achievement h3{margin:0 0 8px;color:#e4bd68}
.achievement p{margin:0 0 10px;color:#b9c2d2;font-size:14px}
.tag{display:inline-block;border:1px solid #6b7284;border-radius:20px;padding:4px 10px;font-size:12px;margin:0 5px 5px 0}
.done{opacity:.65}
footer{text-align:center;color:#8590a4;padding:30px;font-size:12px}

/* 🥉 銅 */
.achievement.rarity-bronze {
  border-color:#cd7f32;
}

/* 🥈 銀 */
.achievement.rarity-silver {
  border-color:#c0c0c0;
}

/* 🥇 金 */
.achievement.rarity-gold {
  border-color:#ffd700;
}

/* 🌈 伝説 */
.achievement.rarity-legend {
  border:2px solid transparent;
  background:
    linear-gradient(#242039,#242039) padding-box,
    linear-gradient(
      120deg,
      #ff4545,
      #ffb52e,
      #f8e84e,
      #48df80,
      #39baff,
      #a569ff,
      #ff4545
    ) border-box;
  box-shadow:0 0 15px rgba(180,110,255,0.3);
}

/* 🔒 未獲得の伝説トロフィー */
.achievement.rarity-legend:not(.done) {
  background: #1b1e29;
  border: 2px solid #555b6c;
  box-shadow: none;
}

/* 🌈 獲得済みの伝説トロフィー */
.achievement.rarity-legend.done {
  opacity: 1;
  box-shadow: 0 0 20px rgba(180,110,255,0.6);
  transition: all 0.4s ease;
}

/* 🏆 トロフィー獲得演出 */
#trophyEffect:not([hidden]) {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.85);
  animation: effectFadeIn 0.3s ease;
}


/* 🥉 銅トロフィー獲得演出 */
#trophyEffect.bronze #trophyEffectContent {
  border-color: #cd7f32;
  box-shadow: 0 0 40px rgba(205,127,50,0.5);
}

#trophyEffect.bronze #trophyEffectTitle {
  color: #cd7f32;
}

/* 🥈 銀トロフィー獲得演出 */
#trophyEffect.silver #trophyEffectContent {
  border-color: #c0c0c0;
  box-shadow: 0 0 40px rgba(192,192,192,0.5);
}

#trophyEffect.silver #trophyEffectTitle {
  color: #c0c0c0;
}

/* 🥇 金トロフィー獲得演出 */
#trophyEffect.gold #trophyEffectContent {
  border-color: #ffd700;
  box-shadow: 0 0 40px rgba(255,215,0,0.5);
}

#trophyEffect.gold #trophyEffectTitle {
  color: #ffd700;
}
#trophyEffectContent {
  width: 90%;
  max-width: 420px;
  padding: 40px 20px;
  text-align: center;
  background: #1b2333;
  border: 2px solid #ffd700;
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
  animation: trophyAppear 0.6s ease;
}

#trophyEffectIcon {
  font-size: 72px;
  animation: trophyBounce 0.8s ease;
}

#trophyEffectTitle {
  color: #ffd700;
  font-size: 24px;
}

#trophyEffectName {
  color: #fff;
  font-size: 20px;
}

/* 🌈 伝説専用演出 */
#trophyEffect.legendary #trophyEffectContent {
  border: 3px solid transparent;
  background:
    linear-gradient(#1b2333, #1b2333) padding-box,
    linear-gradient(
      120deg,
      red, orange, yellow, lime,
      cyan, blue, violet, red
    ) border-box;
  box-shadow: 0 0 60px rgba(180, 110, 255, 0.8);
}

#trophyEffect.legendary #trophyEffectTitle {
  background: linear-gradient(
    90deg, red, orange, yellow,
    lime, cyan, blue, violet
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

@keyframes effectFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes trophyAppear {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes trophyBounce {
  0% { transform: scale(0.3); }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* トロフィー登場アニメーション */
@keyframes trophyPop {
  0% {
    transform: scale(0.3) rotate(-12deg);
    opacity: 0;
  }
  65% {
    transform: scale(1.2) rotate(4deg);
    opacity: 1;
  }
  85% {
    transform: scale(0.95) rotate(-2deg);
  }
  100% {
    transform: scale(1) rotate(0deg);
    opacity: 1;
  }
}

/* レアリティ別の発光 */
@keyframes trophyGlow {
  0%, 100% {
    filter: drop-shadow(0 0 8px var(--trophy-glow));
  }
  50% {
    filter: drop-shadow(0 0 28px var(--trophy-glow));
  }
}

#trophyEffectIcon {
  --trophy-glow: #ffd700;
}

#trophyEffect.bronze #trophyEffectIcon {
  --trophy-glow: #cd7f32;
}

#trophyEffect.silver #trophyEffectIcon {
  --trophy-glow: #dce6f5;
}

#trophyEffect.gold #trophyEffectIcon {
  --trophy-glow: #ffd700;
}

#trophyEffect.legendary #trophyEffectIcon {
  --trophy-glow: #b46aff;
}

#trophyEffect.show #trophyEffectIcon img {
  animation:
    trophyPop 0.8s ease-out both,
    trophyGlow 1.5s ease-in-out 0.8s infinite;
}

/* プロフィールのカードデザイン */
#profileStats {
  background: #202a3d;
  border: 1px solid #3d465a;
  border-radius: 16px;
  padding: 16px;
}

#profileTitle {
  color: #e4bd68;
  font-size: 22px;
  margin: 0 0 16px;
}

#profileStats > div:first-of-type {
  padding: 12px;
  background: #263148;
  border-radius: 12px;
}

#profileAvatar {
  margin: 0 auto 12px;
}

#profileStats h4 {
  color: #e4bd68;
}

#profileStats p {
  line-height: 1.7;
}

.profileHeader {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
  margin-bottom: 18px;
}

.profileHeader > div {
  min-width: 0;
}

.profileHeader #profileTitle {
  margin: 0 0 6px;
  overflow-wrap: anywhere;
}

.profileSubtitle {
  margin: 0;
  color: #aeb7c9;
  font-size: 12px;
}

#profileHeaderAvatar {
  flex-shrink: 0;
  border: 3px solid #e4bd68;
}

/* プロフィール画像の重複表示を防ぐ */
#profileAvatar {
  display: none !important;
}

/* プロフィール画像変更欄 */
#profileStats > div:nth-of-type(2) {
  background: transparent;
  padding: 0;
}

/* 獲得トロフィー・達成率をカード化 */
#profileStats > p {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  vertical-align: top;

  width: calc(50% - 6px);
  min-height: 100px;
  margin: 8px 3px;
  padding: 12px 6px;

  background: #263148;
  border: 1px solid #3d465a;
  border-radius: 12px;

  color: #aeb7c9;
  font-size: 13px;
  text-align: center;
}

#profileUnlocked,
#profileRate {
  display: block;
  margin: 6px 0;
  color: #e4bd68;
  font-size: 28px;
  font-weight: bold;
}

/* レアリティ別の獲得状況 */
#rarityStats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 20px;
}

#rarityStats h4,
#rarityProgress {
  grid-column: 1 / -1;
}

#rarityStats > p {
  margin: 0;
  padding: 14px 8px;
  background: #263148;
  border: 1px solid #3d465a;
  border-radius: 12px;
  text-align: center;
  font-size: 14px;
  min-width: 0;
}

#rarityStats > p strong {
  display: block;
  margin-top: 8px;
  font-size: 25px;
  color: #e4bd68;
}

#rarityStats h4 {
  margin: 0 0 4px;
  color: #e4bd68;
}

#rarityStats > p[hidden] {
  display: none;
}

/* プロフィール編集欄 */
#bioEditor,
#signedIn > div:has(#profileUsername),
#profileStats > div:has(#avatarInput) {
  display: none;
}

/* 編集モード中だけ表示 */
#signedIn.editing #bioEditor,
#signedIn.editing > div:has(#profileUsername),
#signedIn.editing #profileStats > div:has(#avatarInput) {
  display: block;
}
</style>

</head>
<body>
<header>
<h1>🏆猫逆トロフィー🏆</h1>
<p>あなたの戦績を、伝説に。</p>
</header>
  <section id="userAuth" style="max-width:500px;margin:24px auto;padding:20px;background:#1c2232;border-radius:12px;color:#e5c16c">
  <h2>🏆 ユーザーアカウント</h2>
  <div id="authForm">
    <input id="userEmail" type="email" placeholder="メールアドレス" autocomplete="email" style="width:100%;padding:12px;margin:6px 0">
    <input id="userPassword" type="password" placeholder="パスワード（6文字以上）" autocomplete="current-password" style="width:100%;padding:12px;margin:6px 0">
    <button id="signupBtn" type="button">新規登録</button>
    <button id="signinBtn" type="button">ログイン</button>
  </div>
  <div id="signedIn" hidden>
    
<div id="bioEditor" style="margin-top:20px;">
  <h3>✏️ 自己紹介を編集</h3>
  <textarea
    id="bioInput"
    maxlength="500"
    rows="5"
    placeholder="自己紹介を入力してください（500文字以内）"
    style="width:100%;box-sizing:border-box;"
  ></textarea>
  <button id="saveBioBtn" type="button">
    自己紹介を保存
  </button>
  <p id="bioMessage"></p>
</div>

<div id="profileStats" style="margin-top:20px;">

<div class="profileHeader">
  <img id="profileHeaderAvatar"
       alt="プロフィール画像"
       width="80"
       height="80"
       style="display:none; border-radius:50%; object-fit:cover;">

  <div>
    <h3 id="profileTitle">🏆 マイプロフィール</h3>
    
<button id="editProfileBtn" type="button">
  ✏️ 編集
</button>

    <p class="profileSubtitle">猫逆トロフィー プレイヤー</p>
  </div>
</div>

 
<div style="margin: 15px 0;">
  <img id="profileAvatar"
       alt="プロフィール画像"
       width="100"
       height="100"
       style="border-radius:50%; object-fit:cover; display:none;">

  <div style="margin-top:10px;">
    <input id="avatarInput" type="file" accept="image/*">
    <button id="uploadAvatarBtn" type="button">
      プロフィール画像を保存
    </button>
  </div>

  <p id="avatarMessage" role="status"></p>
</div>
 
<div id="profileBioSection" style="margin-top:16px;">
  <h4>📝 自己紹介</h4>
  <p id="profileBio" style="white-space:pre-wrap;overflow-wrap:anywhere;">自己紹介はまだありません。</p>
</div>

  <p>獲得トロフィー：<strong id="profileUnlocked">0</strong> 個</p>
  <p>達成率：<strong id="profileRate">0%</strong></p>

<div id="rarityStats" style="margin-top:16px;">
  <h4>🏅 レアリティ別の獲得状況</h4>
  <p>🥉 銅：<strong id="bronzeCount">0</strong> 個</p>
  <p>🥈 銀：<strong id="silverCount">0</strong> 個</p>
  <p>🥇 金：<strong id="goldCount">0</strong> 個</p>
  
<p id="legendStatsRow" hidden>
  🌈 伝説：<strong id="legendCount">0</strong> 個
</p>


<div id="rarityProgress" style="margin-top:20px;">
  <h4>📊 レアリティ別達成率</h4>
  <div id="rarityProgressBars"></div>
</div>
</div>
</div>

    
<p id="signedInEmail"></p>
<button id="signoutBtn" type="button">ログアウト</button>

<div style="margin-top:12px;">
  <input id="profileUsername" type="text" maxlength="20" placeholder="ユーザー名（20文字以内）">
  <button id="saveUsernameBtn" type="button">ユーザー名を保存</button>
  <p id="profileMessage" role="status"></p>
</div>


</div>
<p id="authMessage" role="status"></p>
</section>

<main>

<section class="panel">
<strong>実績達成状況</strong>
<h2 id="count">0 / 0 達成</h2>
<div class="progress"><div id="bar"></div></div>
<div id="percent" class="muted">達成率 0%</div>
</section>
<div class="controls">
<input id="search" placeholder="実績を検索">
<select id="rarity">
<option value="">全レア度</option>
<option>銅</option><option>銀</option>
<option>金</option><option>伝説</option>
</select>
<select id="status">
<option value="">すべて</option>
<option value="done">達成済み</option>
<option value="todo">未達成</option>
</select>
<select id="sort">
  <option value="default">標準順</option>
  <option value="todo">未獲得を優先</option>
  <option value="done">獲得済みを優先</option>
  <option value="high">レアリティが高い順</option>
  <option value="low">レアリティが低い順</option>
</select>

</div>
<div id="list"></div>
</main>
<footer>猫逆トロフィー | 実績は自己申告制</footer>
  
<div id="trophyEffect" hidden>
  <div id="trophyEffectContent">
    
<div id="trophyEffectIcon">
  <svg viewBox="0 0 120 120" width="100" height="100"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="trophyMetal" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fff3c0"/>
        <stop offset="35%" stop-color="#ffd700"/>
        <stop offset="70%" stop-color="#b8860b"/>
        <stop offset="100%" stop-color="#fff0a0"/>
      </linearGradient>
    </defs>
    <g fill="url(#trophyMetal)" stroke="#654321" stroke-width="2">
      <path d="M32 18 H88 L82 67 Q60 90 38 67 Z"/>
      <path d="M32 27 H18 V40 Q18 61 40 61"
            fill="none" stroke-width="8"/>
      <path d="M88 27 H102 V40 Q102 61 80 61"
            fill="none" stroke-width="8"/>
      <rect x="55" y="78" width="10" height="19"/>
      <rect x="38" y="97" width="44" height="10" rx="3"/>
    </g>
  </svg>
</div>

    <h2 id="trophyEffectTitle"></h2>
    <p id="trophyEffectName"></p>
  </div>
</div>

<script>
let achievements = [];
const key="neko-trophy-progress-v1";
let completed={};
try{completed=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}
const list=document.getElementById("list");
function render(){
const q=document.getElementById("search").value.toLowerCase();
const rarity=document.getElementById("rarity").value;
const status=document.getElementById("status").value;
const total=achievements.length;
const done=achievements.filter(a=>completed[a.id]).length;
document.getElementById("count").textContent=`${done} / ${total} 達成`;
const pct=total?Math.round(done/total*100):0;

const rarityCounts = {
  "銅": 0,
  "銀": 0,
  "金": 0,
  "伝説": 0
};

achievements.forEach(a => {
  if (completed[a.id] && a.rarity in rarityCounts) {
    rarityCounts[a.rarity]++;
  }
});

document.getElementById("bronzeCount").textContent = rarityCounts["銅"];
document.getElementById("silverCount").textContent = rarityCounts["銀"];
document.getElementById("goldCount").textContent = rarityCounts["金"];
document.getElementById("legendCount").textContent = rarityCounts["伝説"];

document.getElementById("legendStatsRow").hidden =
  rarityCounts["伝説"] === 0;

const raritySettings = [
  { name: "銅", icon: "🥉", color: "#cd7f32" },
  { name: "銀", icon: "🥈", color: "#c0c0c0" },
  { name: "金", icon: "🥇", color: "#ffd700" },
  { name: "伝説", icon: "🌈", color: "#a569ff" }
];

const progressContainer =
  document.getElementById("rarityProgressBars");

progressContainer.replaceChildren();

raritySettings.forEach(({ name, icon, color }) => {
  
  if (name === "伝説" && rarityCounts["伝説"] === 0) {
    return;
  }

  const total = achievements.filter(
    a => a.rarity === name
  ).length;

  const unlocked = rarityCounts[name];
  const rate = total
    ? Math.round(unlocked / total * 100)
    : 0;

  const label = document.createElement("p");
  label.textContent =
    `${icon} ${name}：${unlocked}/${total}（${rate}%）`;

  const track = document.createElement("div");
  track.style.cssText =
    "height:10px;background:#343c4c;" +
    "border-radius:20px;overflow:hidden;" +
    "margin-bottom:16px;";

  const fill = document.createElement("div");
  fill.style.height = "100%";
  fill.style.width = rate + "%";
  fill.style.background = name === "伝説"
    ? "linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet)"
    : color;
  fill.style.borderRadius = "20px";

  track.append(fill);
  progressContainer.append(label, track);
});
  
document.getElementById("profileUnlocked").textContent = done;
document.getElementById("profileRate").textContent = pct + "%";

document.getElementById("bar").style.width=pct+"%";
document.getElementById("percent").textContent=`達成率 ${pct}%`;
list.replaceChildren();
const filtered=achievements.filter(a=>
(a.name+a.description+a.role).toLowerCase().includes(q)&&
(!rarity||a.rarity===rarity)&&
(!status||(status==="done"?!!completed[a.id]:!completed[a.id]))
);

const sort = document.getElementById("sort").value;

const rarityOrder = {
  "銅": 1,
  "銀": 2,
  "金": 3,
  "伝説": 4
};

filtered.sort((a, b) => {
  
  // 未獲得の伝説トロフィーは必ず最後に表示
  const hiddenA = a.rarity === "伝説" && !completed[a.id];
  const hiddenB = b.rarity === "伝説" && !completed[b.id];

  if (hiddenA !== hiddenB) {
    return hiddenA ? 1 : -1;
  }

  if (sort === "todo") {
    return Number(!!completed[a.id]) - Number(!!completed[b.id]);
  }

  if (sort === "done") {
    return Number(!!completed[b.id]) - Number(!!completed[a.id]);
  }

  if (sort === "high") {
    return rarityOrder[b.rarity] - rarityOrder[a.rarity];
  }

  if (sort === "low") {
    return rarityOrder[a.rarity] - rarityOrder[b.rarity];
  }

  return 0;
});

if(!filtered.length){list.textContent="該当する実績がありません";return}
filtered.forEach(a=>{
const card=document.createElement("article");

const rarityClass = {
  "銅": "rarity-bronze",
  "銀": "rarity-silver",
  "金": "rarity-gold",
  "伝説": "rarity-legend"
};

card.className = "achievement " +
  (rarityClass[a.rarity] || "") +
  (completed[a.id] ? " done" : "");


const check = document.createElement("input");
check.type = "checkbox";

const allNormalUnlocked = achievements
  .filter(item => item.rarity !== "伝説")
  .every(item => completed[item.id]);

const legendLocked =
  a.rarity === "伝説" && !allNormalUnlocked;

check.checked = !!completed[a.id];

check.disabled =
  !!completed[a.id] || legendLocked;


check.setAttribute("aria-label",a.name+"を達成");

check.addEventListener("change", async () => {
  const wasChecked = !check.checked;

  check.disabled = true;

  const { data: { user } } = await db.auth.getUser();

  if (!user) {
    alert("実績を保存するにはログインしてください。");
    check.checked = wasChecked;
    check.disabled = false;
    return;
  }

  const result = check.checked
    ? await db.from("user_achievements").upsert({
        user_id: user.id,
        achievement_id: a.id
      })
    : await db.from("user_achievements")
        .delete()
        .eq("user_id", user.id)
        .eq("achievement_id", a.id);

  if (result.error) {
    alert("保存失敗：" + result.error.message);

async function uploadAvatar(file) {
  const { data: { user }, error: authError } = await db.auth.getUser();

  if (authError || !user) {
    alert("ログインしてください");
    return;
  }

  const filePath = `${user.id}/avatar-${Date.now()}.png`;

  const { error: uploadError } = await db.storage
    .from("avatars")
    .upload(filePath, file, {
      contentType: file.type,
      upsert: false
    });

  if (uploadError) {
    alert("画像のアップロードに失敗しました：" + uploadError.message);
    return;
  }

  const { data } = db.storage
    .from("avatars")
    .getPublicUrl(filePath);

  return data.publicUrl;
}
